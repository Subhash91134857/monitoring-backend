version: '3.8'

services:
  # 1. PostgreSQL Database Engine (Exposed to localhost:5432)
  postgres:
    image: postgres:15-alpine
    container_name: monitoring-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postrgres      # Retaining the 'postrgres' fallback typo matching your application.yml
      POSTGRES_PASSWORD: Subhash
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postrgres -d monitoring_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Distributed Cache (Exposed to localhost:6379)
  redis:
    image: redis:7-alpine
    container_name: monitoring-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MailPit Testing Service (Exposed to localhost:1025 and 8025)
  mailpit:
    image: axllent/mailpit
    container_name: monitoring-mailpit-local
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Dashboard Port
    environment:
      - MP_SMTP_DISABLE_STARTTLS=false
    restart: unless-stopped

volumes:
  postgres_local_data:
  redis_local_data:

